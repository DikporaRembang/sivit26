<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVIT26 - Sistem Informasi Manajemen</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body * { visibility: hidden; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- ================= AUTH CONTAINER ================= -->
    <div id="authContainer" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-100">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-blue-600 tracking-wide">SIVIT26</h1>
                <p class="text-sm text-slate-500 mt-1">Sistem Informasi & Verifikasi Terpadu</p>
            </div>

            <div class="flex border-b border-slate-200 mb-6">
                <button id="tabLogin" onclick="switchTab('login')" class="flex-1 pb-3 font-semibold text-blue-600 border-b-2 border-blue-600 transition-all">Masuk</button>
                <button id="tabRegister" onclick="switchTab('register')" class="flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent transition-all">Daftar Sekolah</button>
            </div>

            <!-- Form Login -->
            <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Username / NPSN</label>
                    <input type="text" id="loginUser" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                    <input type="password" id="loginPass" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors text-sm shadow-sm">Masuk Sistem</button>
            </form>

            <!-- Form Register -->
            <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">NPSN Sekolah</label>
                    <input type="text" id="regNpsn" required placeholder="Masukkan NPSN resmi..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nama Sekolah (Autofill)</label>
                    <input type="text" id="regNamaSekolah" readonly placeholder="Otomatis dari database dinas..." class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-slate-600 text-sm cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password Akun</label>
                    <input type="password" id="regPass" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg transition-colors text-sm shadow-sm">Daftarkan Sekolah</button>
            </form>
            
            <div id="authLoading" class="hidden text-center mt-4">
                <p class="text-xs text-blue-600 animate-pulse font-medium"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Sedang memproses...</p>
            </div>
        </div>
    </div>

    <!-- ================= MAIN APP CONTAINER ================= -->
    <div id="appContainer" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-sm">S26</div>
                    <div>
                        <h2 class="font-bold text-slate-800 text-base">SIVIT26 Dashboard</h2>
                        <p class="text-xs text-slate-500" id="userRoleSubtitle">Role: -</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right hidden sm:block">
                        <p class="text-xs font-bold text-slate-700" id="userNameDisplay">-</p>
                        <p class="text-[11px] text-slate-400" id="userNpsnDisplay">-</p>
                    </div>
                    <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors border border-red-200">
                        <i class="fa-solid fa-power-off mr-1"></i> Keluar
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex max-w-7xl w-full mx-auto">
            <aside class="w-64 bg-white border-r border-slate-200 p-4 hidden md:block space-y-1">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">Menu Navigasi</p>
                <div id="sidebarMenuContainer" class="space-y-1"></div>
            </aside>

            <main class="flex-1 p-4 md:p-6 overflow-x-auto">
                <div id="printableArea" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-100">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800" id="contentTitle">Pilih Menu</h3>
                            <p class="text-xs text-slate-500" id="contentSubtitle">Kelola dan pantau data pekerjaan.</p>
                        </div>
                        <div id="actionButtonContainer" class="flex items-center space-x-2">
                            <!-- Tombol Dinamis (Tambah & Cetak) -->
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead id="tableHead" class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200"></thead>
                            <tbody id="tableBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ================= MODAL FORM ================= -->
    <div id="dataModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Form Data</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="dynamicForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="formRowIndex">
                <div id="formFieldsContainer" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1"></div>
                <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-medium">Batal</button>
                    <button type="submit" id="btnSaveModal" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= SCRIPT LOGIC ================= -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxSAYpoDmTW0z1FkKzWeLCERraNcrjUFYaljj6A22fDmQa0a4n1PEoCm08qs6WWIim19Q/exec";

        let currentUser = null;
        let currentActiveSheet = "";
        let currentTableHeaders = [];

        function switchTab(tab) {
            if(tab === 'login') {
                document.getElementById('formLogin').classList.remove('hidden');
                document.getElementById('formRegister').classList.add('hidden');
                document.getElementById('tabLogin').className = "flex-1 pb-3 font-semibold text-blue-600 border-b-2 border-blue-600 transition-all";
                document.getElementById('tabRegister').className = "flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent transition-all";
            } else {
                document.getElementById('formLogin').classList.add('hidden');
                document.getElementById('formRegister').classList.remove('hidden');
                document.getElementById('tabRegister').className = "flex-1 pb-3 font-semibold text-emerald-600 border-b-2 border-emerald-600 transition-all";
                document.getElementById('tabLogin').className = "flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent transition-all";
            }
        }

        document.getElementById('regNpsn').addEventListener('blur', function() {
            let npsnVal = this.value.trim();
            let inputNama = document.getElementById('regNamaSekolah');
            if(!npsnVal) return;

            inputNama.value = "Memeriksa database Dinas...";

            fetch(`${WEB_APP_URL}?action=checkNpsn&npsn=${npsnVal}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success') {
                    inputNama.value = res.nama_lengkap;
                } else {
                    alert(res.pesan);
                    inputNama.value = "";
                }
            })
            .catch(err => {
                inputNama.value = "";
                alert("Gagal terhubung ke server.");
            });
        });

        function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('loginUser').value;
            let p = document.getElementById('loginPass').value;
            setAuthLoading(true);

            fetch(`${WEB_APP_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`)
            .then(res => res.json())
            .then(res => {
                setAuthLoading(false);
                if(res.status === 'success') {
                    currentUser = res;
                    localStorage.setItem('sivit_user', JSON.stringify(res));
                    initApp();
                } else {
                    alert(res.pesan);
                }
            })
            .catch(err => {
                setAuthLoading(false);
                alert("Kesalahan koneksi saat login.");
            });
        }

        function handleRegister(e) {
            e.preventDefault();
            let npsn = document.getElementById('regNpsn').value;
            let nama = document.getElementById('regNamaSekolah').value;
            let pass = document.getElementById('regPass').value;

            if(!nama) {
                alert("NPSN belum divalidasi atau tidak terdaftar!");
                return;
            }

            setAuthLoading(true);
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: 'register', npsn: npsn, password: pass, nama_lengkap: nama })
            })
            .then(res => res.json())
            .then(res => {
                setAuthLoading(false);
                alert(res.pesan);
                if(res.status === 'success') {
                    switchTab('login');
                    document.getElementById('formRegister').reset();
                    document.getElementById('regNamaSekolah').value = "";
                }
            })
            .catch(err => {
                setAuthLoading(false);
                alert("Kesalahan jaringan.");
            });
        }

        function setAuthLoading(show) {
            let el = document.getElementById('authLoading');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        window.onload = function() {
            let saved = localStorage.getItem('sivit_user');
            if(saved) {
                currentUser = JSON.parse(saved);
                initApp();
            }
        };

        function logout() {
            localStorage.removeItem('sivit_user');
            currentUser = null;
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('authContainer').classList.remove('hidden');
        }

        function initApp() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = currentUser.nama_pengguna;
            document.getElementById('userNpsnDisplay').innerText = "NPSN/ID: " + currentUser.username;
            document.getElementById('userRoleSubtitle').innerText = "Hak Akses: " + currentUser.role;

            buildSidebar();
            
            if(currentUser.role === 'DINAS') {
                loadTableData('sekolah_pending', 'Verifikasi Sekolah');
            } else {
                loadTableData('paket_pekerjaan_sd', 'Paket Pekerjaan SD');
            }
        }

        function buildSidebar() {
            let container = document.getElementById('sidebarMenuContainer');
            container.innerHTML = "";
            let menus = [];

            if(currentUser.role === 'DINAS') {
                menus = [
                    { name: 'Verifikasi Sekolah', sheet: 'sekolah_pending', icon: 'fa-user-check text-amber-500' },
                    { name: 'Data Sekolah', sheet: 'sekolah', icon: 'fa-school' },
                    { name: 'Menu Pekerjaan', sheet: 'menu_pekerjaan', icon: 'fa-list-check' },
                    { name: 'Paket Pekerjaan SD', sheet: 'paket_pekerjaan_sd', icon: 'fa-folder-open' },
                    { name: 'Laporan Progres', sheet: 'laporan_progres', icon: 'fa-chart-line' },
                    { name: 'Riwayat Pagu', sheet: 'riwayat_pagu', icon: 'fa-clock-rotate-left' }
                ];
            } else {
                menus = [
                    { name: 'Paket Pekerjaan SD', sheet: 'paket_pekerjaan_sd', icon: 'fa-folder-open' },
                    { name: 'Laporan Progres', sheet: 'laporan_progres', icon: 'fa-chart-line' }
                ];
            }

            menus.forEach(m => {
                let btn = document.createElement('button');
                btn.className = `w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-xs font-medium transition-colors text-slate-600 hover:bg-slate-100`;
                btn.innerHTML = `<i class="fa-solid ${m.icon} w-4 text-slate-400"></i><span>${m.name}</span>`;
                btn.onclick = () => loadTableData(m.sheet, m.name);
                container.appendChild(btn);
            });
        }

        function loadTableData(sheetName, customTitle = "") {
            currentActiveSheet = sheetName;
            document.getElementById('contentTitle').innerText = customTitle || sheetName.replace(/_/g, ' ').toUpperCase();
            document.getElementById('tableHead').innerHTML = `<tr><th class="p-3 text-center">Memuat data...</th></tr>`;
            document.getElementById('tableBody').innerHTML = "";
            let actionContainer = document.getElementById('actionButtonContainer');
            actionContainer.innerHTML = "";

            // Pengaturan Tombol Tambah & Cetak Berdasarkan Role & Menu
            let canAdd = false;
            let canPrint = false;

            if (currentUser.role === 'DINAS') {
                if (['sekolah', 'menu_pekerjaan'].includes(sheetName)) {
                    canAdd = true;
                }
                if (['paket_pekerjaan_sd', 'laporan_progres', 'riwayat_pagu'].includes(sheetName)) {
                    canPrint = true;
                }
            } else if (currentUser.role === 'SEKOLAH') {
                if (['paket_pekerjaan_sd', 'laporan_progres'].includes(sheetName)) {
                    canAdd = true;
                    canPrint = true;
                }
            }

            if (canAdd) {
                let addBtn = document.createElement('button');
                addBtn.className = "no-print bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-medium transition-colors shadow-sm";
                addBtn.innerHTML = `<i class="fa-solid fa-plus mr-1"></i> Tambah Data`;
                addBtn.onclick = () => openModalForm(null);
                actionContainer.appendChild(addBtn);
            }

            if (canPrint) {
                let printBtn = document.createElement('button');
                printBtn.className = "no-print bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-lg text-xs font-medium transition-colors shadow-sm";
                printBtn.innerHTML = `<i class="fa-solid fa-print mr-1"></i> Cetak / PDF`;
                printBtn.onclick = () => window.print();
                actionContainer.appendChild(printBtn);
            }

            fetch(`${WEB_APP_URL}?action=getData&sheet=${sheetName}&role=${currentUser.role}&npsn=${currentUser.username}`)
            .then(res => res.json())
            .then(res => {
                currentTableHeaders = res.header;
                renderTable(res.header, res.data, sheetName);
            })
            .catch(err => {
                document.getElementById('tableBody').innerHTML = `<tr><td class="p-3 text-red-500 text-center">Gagal memuat data.</td></tr>`;
            });
        }

        function renderTable(headers, data, sheetName) {
            let headEl = document.getElementById('tableHead');
            let bodyEl = document.getElementById('tableBody');

            if(headers.length === 0) {
                headEl.innerHTML = `<tr><th class="p-3 text-center text-slate-400">Tidak ada kolom</th></tr>`;
                bodyEl.innerHTML = `<tr><td class="p-3 text-center text-slate-400">Data kosong.</td></tr>`;
                return;
            }

            let trHead = document.createElement('tr');
            headers.forEach(h => {
                let th = document.createElement('th');
                th.className = "p-3 font-semibold text-slate-600";
                th.innerText = h;
                trHead.appendChild(th);
            });
            
            let showActionColumn = true;
            if (currentUser.role === 'DINAS' && ['paket_pekerjaan_sd', 'laporan_progres', 'riwayat_pagu'].includes(sheetName)) {
                showActionColumn = false; // Dinas hanya bisa lihat dan cetak pada menu ini
            }

            if (showActionColumn) {
                let thAction = document.createElement('th');
                thAction.className = "no-print p-3 font-semibold text-slate-600 text-right";
                thAction.innerText = "Aksi";
                trHead.appendChild(thAction);
            }
            headEl.innerHTML = "";
            headEl.appendChild(trHead);

            bodyEl.innerHTML = "";
            if(data.length === 0) {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="${headers.length + (showActionColumn ? 1 : 0)}" class="p-4 text-center text-slate-400 text-xs">Belum ada record data</td>`;
                bodyEl.appendChild(tr);
                return;
            }

            data.forEach(row => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors border-b border-slate-100";
                
                headers.forEach(h => {
                    let td = document.createElement('td');
                    td.className = "p-3 text-slate-700 text-xs truncate max-w-xs";
                    td.innerText = row[h] !== undefined ? row[h] : "";
                    tr.appendChild(td);
                });

                if (showActionColumn) {
                    let tdAct = document.createElement('td');
                    tdAct.className = "no-print p-3 text-right space-x-1";
                    
                    if (sheetName === 'sekolah_pending') {
                        let btnApprove = document.createElement('button');
                        btnApprove.className = "px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded text-[11px] font-medium border border-emerald-200";
                        btnApprove.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Approve`;
                        btnApprove.onclick = () => verifyReg(row.username || row.npsn, 'APPROVED');
                        tdAct.appendChild(btnApprove);

                        let btnReject = document.createElement('button');
                        btnReject.className = "px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded text-[11px] font-medium border border-red-200";
                        btnReject.innerHTML = `<i class="fa-solid fa-xmark mr-1"></i> Reject`;
                        btnReject.onclick = () => verifyReg(row.username || row.npsn, 'REJECTED');
                        tdAct.appendChild(btnReject);
                    } else {
                        // Tombol Edit
                        let btnEdit = document.createElement('button');
                        btnEdit.className = "px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-600 rounded text-[11px] font-medium border border-amber-200";
                        btnEdit.innerHTML = `<i class="fa-solid fa-pen-to-square"></i>`;
                        btnEdit.onclick = () => openModalForm(row);
                        tdAct.appendChild(btnEdit);

                        // Tombol Hapus (DINAS bisa hapus data sekolah & menu_pekerjaan; SEKOLAH tidak bisa hapus sama sekali)
                        if (currentUser.role === 'DINAS') {
                            let btnDel = document.createElement('button');
                            btnDel.className = "px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded text-[11px] font-medium border border-red-200";
                            btnDel.innerHTML = `<i class="fa-solid fa-trash"></i>`;
                            btnDel.onclick = () => deleteRowData(row._rowIndex);
                            tdAct.appendChild(btnDel);
                        }
                    }
                    tr.appendChild(tdAct);
                }
                bodyEl.appendChild(tr);
            });
        }

        async function verifyReg(npsn, status) {
            if(!confirm(`Ubah status pendaftaran menjadi ${status}?`)) return;
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'verifyRegister', npsn: npsn, status: status })
                });
                const data = await res.json();
                alert(data.pesan);
                loadTableData('sekolah_pending', 'Verifikasi Sekolah');
            } catch (err) {
                alert('Gagal memproses verifikasi.');
            }
        }

        function openModalForm(rowData = null) {
            let container = document.getElementById('formFieldsContainer');
            container.innerHTML = "";
            document.getElementById('formRowIndex').value = rowData ? rowData._rowIndex : "";
            document.getElementById('modalTitle').innerText = rowData ? "Edit Data" : "Tambah Data Baru";

            currentTableHeaders.forEach(h => {
                if(h.toLowerCase().includes('id_riwayat')) return;

                let div = document.createElement('div');
                div.className = "space-y-1";
                
                let label = document.createElement('label');
                label.className = "block text-xs font-semibold text-slate-600 uppercase";
                label.innerText = h;
                div.appendChild(label);

                let input = document.createElement('input');
                input.type = "text";
                input.name = h;
                input.className = "w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none";
                input.value = rowData ? (rowData[h] !== undefined ? rowData[h] : "") : "";

                if(currentUser.role === 'SEKOLAH' && (h.toLowerCase().includes('npsn') || h.toLowerCase().includes('user_id'))) {
                    input.value = currentUser.username;
                    input.readOnly = true;
                    input.className += " bg-slate-100 text-slate-500 cursor-not-allowed";
                }

                div.appendChild(input);
                container.appendChild(div);
            });

            document.getElementById('dataModal').classList.remove('hidden');
            document.getElementById('dataModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('dataModal').classList.add('hidden');
            document.getElementById('dataModal').classList.remove('flex');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            let rowIndex = document.getElementById('formRowIndex').value;
            let formData = {};

            document.querySelectorAll('#formFieldsContainer input').forEach(input => {
                formData[input.name] = input.value;
            });

            let payload = {
                action: "saveData",
                sheet: currentActiveSheet,
                formData: formData,
                rowIndex: rowIndex
            };

            document.getElementById('btnSaveModal').innerText = "Menyimpan...";

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('btnSaveModal').innerText = "Simpan Data";
                alert(res.pesan);
                if(res.status === 'success') {
                    closeModal();
                    loadTableData(currentActiveSheet);
                }
            })
            .catch(err => {
                document.getElementById('btnSaveModal').innerText = "Simpan Data";
                alert("Kesalahan jaringan.");
            });
        }

        function deleteRowData(rowIndex) {
            if(!confirm("Yakin ingin menghapus baris data ini?")) return;

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteData", sheet: currentActiveSheet, rowIndex: rowIndex })
            })
            .then(res => res.json())
            .then(res => {
                alert(res.pesan);
                if(res.status === 'success') {
                    loadTableData(currentActiveSheet);
                }
            })
            .catch(err => alert("Gagal menghapus data."));
        }
    </script>
</body>
</html>
